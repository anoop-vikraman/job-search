services:
  postgres:
    image: postgres:16-alpine
    container_name: tweak_postgres
    env_file: backend/.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tweak_network

  backend:
    build: ./backend
    container_name: tweak_backend
    env_file: backend/.env
    environment:
      # Inside compose, reach the DB by service name, not localhost.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/tweak_db
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tweak_network

volumes:
  postgres_data:

networks:
  tweak_network:
    driver: bridge
